name: Mac room reproduction
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  room:
    strategy:
      fail-fast: false
      matrix:
        release: [pueblo-mxp-spacing-macos-2026-10-11, pueblo-mxp-rendering-macos-2026-10-16]
    runs-on: macos-15
    timeout-minutes: 6
    env:
      PROBE_RELEASE: ${{ matrix.release }}
    steps:
      - uses: actions/checkout@v4
      - name: Launch released app and identify guest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p diagnostic/release
          curl --fail --location --retry 2 --output diagnostic/release.zip "https://github.com/Balerion300/Atlantis/releases/download/$PROBE_RELEASE/Atlantis-macOS-Apple-Silicon.zip"
          if [ "$PROBE_RELEASE" = pueblo-mxp-spacing-macos-2026-10-11 ]; then expected=ca732790fbdffccd1223b857d3e5eec3704ab7b9dbe080aeff01b8e5c21c6fef; else expected=5a253a84f2dd51a44429155edc603071e7e72af15103636a59e612d1a46c975d; fi
          echo "$expected  diagnostic/release.zip" | shasum -a 256 -c -
          ditto -x -k diagnostic/release.zip diagnostic/release
          codesign --verify --deep --strict diagnostic/release/Atlantis.app
          clang -dynamiclib -fblocks -framework Cocoa Tests/Packaged/RoomProbe.m -o diagnostic/RoomProbe.dylib
          codesign --force --sign - diagnostic/RoomProbe.dylib
          python3 Tests/Packaged/run_room.py launch
      - uses: actions/upload-artifact@v4
        with:
          name: Guest-ready-${{ matrix.release }}
          path: diagnostic/results/guest-ready.json
      - name: Finish room look and redact private output
        run: python3 Tests/Packaged/run_room.py finish
      - uses: actions/upload-artifact@v4
        with:
          name: Room-result-${{ matrix.release }}
          path: diagnostic/results/room-summary.json
