name: macOS released-app live diagnostics
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: macos-15
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Download the existing Apple Silicon release
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p diagnostic/release
          curl --fail --location --retry 2 --output diagnostic/release.zip https://github.com/Balerion300/Atlantis/releases/download/pueblo-mxp-spacing-macos-2026-10-11/Atlantis-macOS-Apple-Silicon.zip
          echo 'ca732790fbdffccd1223b857d3e5eec3704ab7b9dbe080aeff01b8e5c21c6fef  diagnostic/release.zip' | shasum -a 256 -c -
          ditto -x -k diagnostic/release.zip diagnostic/release
          codesign --verify --deep --strict diagnostic/release/Atlantis.app
          file diagnostic/release/Atlantis.app/Contents/MacOS/Atlantis | tee diagnostic/architecture.txt
          sw_vers | tee diagnostic/macos.txt
      - name: Run actual released app against Blood of Dragons
        shell: bash
        run: |
          set -euo pipefail
          clang -dynamiclib -fblocks -framework Cocoa Tests/Packaged/LiveProbe.m -o diagnostic/LiveProbe.dylib
          codesign --force --sign - diagnostic/LiveProbe.dylib
          python3 Tests/Packaged/run_probe.py
      - name: Collect reports
        if: always()
        shell: bash
        run: |
          mkdir -p diagnostic/results
          python3 Tests/Packaged/summarize.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Atlantis-released-app-live-diagnostics
          path: |
            diagnostic/results/*
            diagnostic/architecture.txt
            diagnostic/macos.txt
          retention-days: 14
