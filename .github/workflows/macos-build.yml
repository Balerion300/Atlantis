name: macOS Pueblo spawn diagnosis
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: macos-15
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          path: Atlantis
      - name: Test actual released app offline
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p diagnostic/release
          curl --fail --location --silent https://github.com/Balerion300/Atlantis/releases/download/pueblo-image-scroll-macos-2026-10-16/Atlantis-macOS-Apple-Silicon.zip -o diagnostic/release.zip
          ditto -x -k diagnostic/release.zip diagnostic/release
          clang -dynamiclib -fblocks -framework Cocoa Atlantis/Tests/Packaged/SpawnPuebloProbe.m -o diagnostic/SpawnPuebloProbe.dylib
          codesign --force --sign - diagnostic/SpawnPuebloProbe.dylib
          python3 Atlantis/Tests/Packaged/run_spawn_pueblo.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Pueblo-spawn-diagnosis
          path: diagnostic/results/*
          retention-days: 30
